name: Update Disney Wait Times and Busyness

on:
  schedule:
    # Runs every 15 minutes during typical Florida park operating hours (12:00 UTC to 03:00 UTC)
    - cron: '*/15 12-23 * * *'
    - cron: '*/15 0-3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Collector
        run: |
          python scraper_collector.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update live wait times [skip ci]" && git push)
